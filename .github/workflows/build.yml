name: Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4

    - name: Set up MemKernel as a module (M-OUT) with specified name
      run: |
        # Using Poko-Apps link since the aiichi repository is an empty/broken URL path
        curl -LSs "https://githubusercontent.com" | bash -s M dogi

    - name: Android kernel build
      uses: lemniskett/android-kernel-actions@master
      id: build
      env:
        NAME: Loganysl
        # This auto-approves all missing Qualcomm prompts inside the builder container automatically
        KCONFIG_ALLCONFIG: 1
      with:
        arch: arm64
        compiler: clang/11
        defconfig: violet_stock_defconfig
        image: Image.gz-dtb

    - name: Upload Kernel and Module
      uses: actions/upload-artifact@v4
      with:
        name: module
        path: |
          ${{ steps.build.outputs.outfile }}
          ./out/drivers/memkernel/dogi_memk.ko
