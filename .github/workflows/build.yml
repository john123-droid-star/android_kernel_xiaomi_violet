name: Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4

    - name: Fix CPU Mask Configurations
      run: |
        # Inject the bitmask variables without string quotes so the config system validates them correctly
        echo 'CONFIG_LITTLE_CPU_MASK=0x3f' >> arch/arm64/configs/violet_stock_defconfig
        echo 'CONFIG_BIG_CPU_MASK=0xc0' >> arch/arm64/configs/violet_stock_defconfig

    - name: Set up MemKernel as a module (M-OUT) with specified name
      run: |
        curl -LSs "https://raw.githubusercontent.com/Poko-Apps/MemKernel/main/kernel/setup.sh" | bash -s M dogi

    - name: Android kernel build
      uses: lemniskett/android-kernel-actions@master
      id: build
      env:
        NAME: Loganysl
        # Force the engine to auto-accept missing Kconfig values inside the container layout
        KCONFIG_ALLCONFIG: 1
      with:
        arch: arm64
        compiler: clang/11
        defconfig: violet_stock_defconfig
        image: Image.gz-dtb

    - name: Upload Kernel and Module
      uses: actions/upload-artifact@v4
      with:
        name: module
        path: |
          ${{ steps.build.outputs.outfile }}
          ./out/drivers/memkernel/dogi_memk.ko
